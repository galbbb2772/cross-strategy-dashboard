name: Validate Cross Strategy Dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static dashboard
        run: |
          node --check assets/app.js
          python -m json.tool data/historical-top10.json >/dev/null
          python -m json.tool data/forward-oos-snapshot.json >/dev/null
          test -f index.html
