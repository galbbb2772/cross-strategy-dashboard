name: Validate and Deploy Cross Strategy Dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static dashboard
        run: |
          node --check assets/app.js
          python -m json.tool data/forward-oos-snapshot.json >/dev/null
          python -m json.tool data/v2/PHASE_STATUS_SUMMARY.json >/dev/null
          python -m json.tool data/v2/DRAWDOWN_SUMMARY.json >/dev/null
          test -f index.html
          test -f data/v2/MASTER_RESULTS_304_WITH_STABILITY.csv
          test -f data/v2/304_STRUCTURE_INDEX.csv
          test -f data/v2/execution/MASTER_RESULTS_110.csv
          test -f data/v2/execution/NEW_VARIANT_CONFLICT_EXACT_34.csv
          test -f data/v2/rankings/TOP10_HISTORICAL_RETURN.csv
          test -f data/v2/rankings/TOP10_STABILITY.csv
          test -f data/v2/rankings/TOP10_FINANCING_RETURN.csv
          test -f data/v2/rankings/TOP10_CAGR.csv
          test -f data/v2/rankings/TOP10_SHARPE.csv
          test -f data/v2/rankings/TOP10_LOW_DRAWDOWN.csv
          test -f data/v2/rankings/WEIGHT_TOP10_ROBUSTNESS.csv
          test -f data/v2/rankings/WEIGHT_TOP10_15BPS_CAGR.csv
          test -f data/v2/rankings/WEIGHT_TOP10_25BPS_CAGR.csv
          python - <<'PY'
          import csv, pathlib
          root=pathlib.Path('.')
          with open(root/'data/v2/MASTER_RESULTS_304_WITH_STABILITY.csv',newline='',encoding='utf-8') as f:
              master=list(csv.DictReader(f))
          with open(root/'data/v2/304_STRUCTURE_INDEX.csv',newline='',encoding='utf-8') as f:
              index_rows=list(csv.DictReader(f))
          assert len(master)==304, len(master)
          assert len(index_rows)==304, len(index_rows)
          assert {r['structure_id'] for r in index_rows}=={r['structure_id'] for r in master}
          nav_files=[
              'BOX_FROZEN.csv','BOX_RISK.csv','CAPITAL_FROZEN.csv','RISK_FROZEN.csv',
              'TRIPLE_FIXED3.csv','TRIPLE_NEXT_OPEN.csv','TRIPLE_SAME_CLOSE.csv','TRIPLE_T6.csv'
          ]
          ids=set()
          for name in nav_files:
              with open(root/'data/v2/daily_nav'/name,newline='',encoding='utf-8') as f:
                  reader=csv.reader(f)
                  header=next(reader)
                  ids.update(header[1:])
                  rows=sum(1 for _ in reader)
                  assert rows==1612,(name,rows)
          assert len(ids)==304,len(ids)
          assert ids=={r['structure_id'] for r in master}
          print('validated structures:',len(master),'daily series:',len(ids))
          PY
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
